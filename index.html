<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Curves in the Oval — President Simulator</title>
  <script>
    (function () {
      if (!location.hostname.endsWith("github.io")) return;
      var parts = location.pathname.split("/").filter(Boolean);
      if (!parts.length) return;
      var base = document.createElement("base");
      base.href = "/" + parts[0] + "/";
      document.head.appendChild(base);
    })();
  </script>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <div id="app">
    <header class="top-bar">
      <div class="brand">
        <span class="brand-mark">🏛️</span>
        <h1>Curves in the Oval</h1>
        <p class="tagline">The weight-forward presidential sandbox</p>
      </div>
      <div class="header-actions">
        <button type="button" id="btn-new-career" class="ghost">New career</button>
        <button type="button" id="btn-save" class="ghost">Save</button>
      </div>
    </header>

    <main id="screen-container"></main>

    <footer class="site-footer">
      <p>Fictional satire · Not affiliated with any real government · Adults 18+</p>
      <p><a href="https://github.com" id="repo-link">GitHub Pages edition</a></p>
    </footer>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
